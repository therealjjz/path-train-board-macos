name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test shared feed logic
        run: swift test
      - name: Build universal Mac app
        run: ./build.sh --zip
      - uses: actions/upload-artifact@v4
        with:
          name: Tubes
          path: build/Tubes.zip
